# Starcat 落地页 Nginx 配置
# 域名: starcat.ink / www.starcat.ink
# 证书路径: /etc/nginx/encrypt/starcat/（由 NAS update_certs.sh 上传）

server {
    # 监听 HTTP 并重定向到 HTTPS
    listen 80;
    server_name starcat.ink www.starcat.ink;
    return 301 https://$host$request_uri;
}

server {
    # 监听 HTTPS
    listen 443 ssl http2;
    server_name starcat.ink www.starcat.ink;

    # SSL 配置
    ssl_certificate /etc/nginx/encrypt/starcat/fullchain.pem;
    ssl_certificate_key /etc/nginx/encrypt/starcat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 网站根目录
    root /var/www/starcat;
    index index.html;

    # 日志配置
    access_log /var/log/nginx/starcat_access.log;
    error_log /var/log/nginx/starcat_error.log;

    # 基础路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sparkle appcast 必须尽快反映最新版本，避免客户端读到缓存的旧更新清单。
    location = /appcast.xml {
        types { application/xml xml; }
        default_type application/xml;
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Direct 渠道安装包。只允许访问真实文件，不做 SPA fallback，也不开放目录索引。
    location /downloads/ {
        types {
            application/x-apple-diskimage dmg;
            text/plain sha256;
        }
        default_type application/octet-stream;
        try_files $uri =404;
        autoindex off;
        expires 6M;
        add_header Cache-Control "public";
    }

    # JS 和 CSS 文件不缓存（落地页迭代频繁）
    location ~* \.(?:css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        access_log off;
    }

    # 其他静态文件缓存 6 个月
    location ~* \.(?:ico|gif|jpe?g|png|svg|woff|woff2|ttf|otf|eot|webp|webm|mp4)$ {
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 安全头
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 防止 Favicon 报错
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        log_not_found off;
        deny all;
    }
}
