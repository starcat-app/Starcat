    #starcat-refined .sd-summary-list button { width: 100%; min-height: 38px; text-align: left; border: 0; border-radius: 8px; padding: 8px 12px; background: var(--sd-soft); color: var(--sd-text); overflow-wrap: anywhere; }
    #starcat-refined .sd-summary-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    #starcat-refined button { cursor: pointer; }
    #starcat-refined button:focus-visible { outline: 2px solid var(--sd-accent); outline-offset: 3px; }
    #starcat-refined.sd-reduced *, #starcat-refined.sd-reduced *::before, #starcat-refined.sd-reduced *::after { animation: none !important; transition: none !important; }
    #starcat-refined.sd-reduced .sd-tilt { transform: none !important; }
    @keyframes sd-spin { to { transform: rotate(360deg); } }
    @media (max-width: 620px) {
      #starcat-refined .sd-stage, #starcat-refined .sd-heading, #starcat-refined .sd-bottom { width: 100%; }
    }
</style></head>
<body><div id="starcat-refined"><div class="sd-window"><main class="sd-page" aria-busy="true">
  <div class="sd-content"><div class="sd-content-inner">
  <div class="sd-heading"><h1 id="daily-title" data-label="title"></h1><p data-label="subtitle"></p></div>
  <div class="sd-stage" hidden>
    <button type="button" class="sd-peek sd-peek-left" data-action="previous"></button>
    <div class="sd-main"><div class="sd-tilt"><article class="sd-card" aria-labelledby="project-name">
      <div class="sd-card-top">
        <div class="sd-cover" aria-hidden="true"><span class="sd-cover-placeholder"></span></div>
        <div class="sd-project-info"><div class="sd-owner"><span class="sd-avatar" data-field="avatar" aria-hidden="true"></span><span data-field="owner"></span></div>
          <h2 class="sd-project-name" id="project-name"><span data-field="owner-path"></span><span data-field="repo"></span></h2>
          <p class="sd-description" data-field="description"></p>
          <div class="sd-metrics">
            <span class="sd-metric sd-language"><span data-field="language"></span></span>
            <span class="sd-metric sd-stars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg><span data-field="stars"></span></span>
            <span class="sd-metric sd-forks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="4" r="2"/><circle cx="18" cy="4" r="2"/><circle cx="12" cy="20" r="2"/><path d="M6 6v3a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V6M12 12v6"/></svg><span data-field="forks"></span></span>
          </div>
        </div>
      </div>
      <section class="sd-recommend" aria-labelledby="reason-title"><div class="sd-reason-heading"><h3 id="reason-title" data-label="reasonTitle"></h3><button type="button" class="sd-text-button" data-action="retry" data-label="retry" data-retry-explanation hidden></button></div><p class="sd-reason" data-field="reason"></p></section>
      <div class="sd-actions">
        <button type="button" class="sd-button sd-star" data-action="star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg><span data-label="star"></span></button>
        <button type="button" class="sd-button" data-action="details" data-label="details"></button>
        <button type="button" class="sd-button sd-dismiss" data-action="dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8ZM3 3l18 18"/></svg></button>
      </div>
    </article></div></div>
    <button type="button" class="sd-peek sd-peek-right" data-action="next"></button>
  </div>
  <section class="sd-empty" hidden><span class="sd-spinner" aria-hidden="true"></span><h2 data-field="empty"></h2><button class="sd-button" type="button" data-action="retry" data-label="retry"></button></section>
  <section class="sd-summary" hidden><h2 data-label="done"></h2><div class="sd-summary-list"></div><div class="sd-summary-actions"><button class="sd-button" type="button" data-action="close" data-label="done"></button></div></section>
  <nav class="sd-bottom" aria-labelledby="daily-title" hidden><button type="button" class="sd-text-button" data-action="previous" data-label="previous"></button><div class="sd-progress"><span data-field="progress"></span><div class="sd-progress-track" role="group"></div></div><button type="button" class="sd-text-button sd-next" data-action="next" data-label="next"></button></nav>
  <div class="sd-status" role="status" aria-live="polite" aria-atomic="true"><span data-field="message"></span><button type="button" class="sd-text-button" data-action="retry" data-label="retry" hidden></button></div>
  </div></div>
  <div class="sd-preferences"><label><input type="checkbox" data-action="autoShow"><span data-label="autoShow"></span></label><div class="sd-preference-actions"><button class="sd-text-button" type="button" data-action="revealAll" data-label="revealAll"></button><button class="sd-text-button" type="button" data-action="nextBatch" data-label="nextBatch"></button></div></div>
</main></div></div><script>
(() => {
  "use strict";
  const root = document.getElementById("starcat-refined");
  const q = selector => root.querySelector(selector);
  const field = name => q(`[data-field="${name}"]`);
  const main = q(".sd-main"), card = q(".sd-card"), tilt = q(".sd-tilt");
  const listeners = new AbortController();
  let snapshot = null, currentID = null, summary = false, moving = false, destroyed = false;
  let navigationRevision = 0, pointerFrame = 0, presentationFrame = 0, presented = "";
  let compactNumber = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
  let plainNumber = new Intl.NumberFormat("en");
  const index = () => snapshot?.items.findIndex(item => item.id === currentID) ?? -1;
  const active = () => snapshot?.items[index()];
  const busy = () => moving || snapshot?.busy;
  const canAnimate = () => !snapshot?.reduceMotion && typeof main.animate === "function";

  // Native validates context and IDs again. Sending an action never mutates the business snapshot.
  function send(type, extra = {}) {
    if (destroyed) return;
    const body = { type, ...extra };
    if (snapshot) body.context = snapshot.context;
    window.webkit?.messageHandlers?.dailyDiscovery?.postMessage(body);
  }
  function identity(item) {
    const separator = item.fullName.indexOf("/");
    const owner = item.fullName.slice(0, separator), repo = item.fullName.slice(separator + 1);
    return { owner, repo };
  }
  // 两处头像共用原生给出的 owner 图片地址；CSP 仅放行头像入口及其 CDN 重定向。
  function renderCover(item) {
    const cover = q(".sd-cover"), url = item?.coverImageURL || "";
    if (cover.dataset.url === url) return;
    field("avatar").style.backgroundImage = url ? `url(${JSON.stringify(url)})` : "";
    cover.dataset.url = url;
    cover.dataset.state = url ? "loading" : "failed";
    cover.querySelector("img")?.remove();
    if (!url) return;
    const image = new Image();
    image.className = "sd-cover-image";
    image.alt = "";
    image.draggable = false;
    image.referrerPolicy = "no-referrer";
    // 快速翻页后旧图可能才返回；只让仍属于当前封面的图片结束骨架状态。
    const settle = state => {
      if (!destroyed && image.parentElement === cover) cover.dataset.state = state;
    };
    image.addEventListener("load", () => settle(image.naturalWidth > 0 ? "ready" : "failed"),
      { once: true, signal: listeners.signal });
    image.addEventListener("error", () => settle("failed"), { once: true, signal: listeners.signal });
    cover.append(image);
    image.src = url;
    // 内存缓存已就绪时直接展示，不人为插入一轮骨架。
    if (image.complete) settle(image.naturalWidth > 0 ? "ready" : "failed");
  }
  function resetTilt() {
    cancelAnimationFrame(pointerFrame);
    pointerFrame = 0;
    tilt.style.setProperty("--sd-rx", "0deg");
    tilt.style.setProperty("--sd-ry", "0deg");
    card.style.setProperty("--sd-mx", "30%");
    card.style.setProperty("--sd-my", "10%");
  }
  function stopMotion() {
    navigationRevision++;
    main.getAnimations?.().forEach(animation => animation.cancel());
    moving = false;
    resetTilt();
  }

  // Wait for the card's painted frame, including the end of a transition, before persisting progress.
  function reportPresentation() {
    cancelAnimationFrame(presentationFrame);
    if (!active() || moving || summary || destroyed) return;
    const item = active(), key = `${snapshot.context}|${item.id}`;
    presentationFrame = requestAnimationFrame(() => {
      presentationFrame = requestAnimationFrame(() => {
        if (destroyed || document.hidden || moving || summary || key !== `${snapshot?.context}|${active()?.id}`) return;
        // Returning to the same card after a batch replacement still needs a new native acknowledgment.
        if (presented !== key) {
          presented = key;
          send("presented", { id: item.id });
        }
      });
    });
  }
  function updatePreview(side, delta) {
    const target = snapshot.items[index() + delta];
    const button = q(`.sd-peek-${side === "previous" ? "left" : "right"}`);
    button.hidden = !target;
    button.disabled = Boolean(busy()) || !target;
    button.setAttribute("aria-label", target ? `${snapshot.labels[side]}: ${target.fullName}` : "");
    button.title = target?.fullName || "";
  }
  function render() {
    if (!snapshot || destroyed) return;
    root.style.colorScheme = snapshot.dark ? "dark" : "light";
    root.style.setProperty("--sd-scale", String(snapshot.scale));
    root.classList.toggle("sd-reduced", snapshot.reduceMotion);
    document.documentElement.lang = snapshot.locale;
    q(".sd-page").setAttribute("aria-busy", String(Boolean(snapshot.loading || moving)));
    root.querySelectorAll("[data-label]").forEach(element => {
      element.textContent = snapshot.labels[element.dataset.label] || "";
    });
    // 图标按钮的本地化语义放在属性上，避免文案刷新覆盖心形斜杠图标。
    const dismiss = q('[data-action="dismiss"]');
    dismiss.title = snapshot.labels.dismiss;
    dismiss.setAttribute("aria-label", snapshot.labels.dismiss);
    const item = active(), empty = !item;
    q(".sd-stage").hidden = empty || summary;
    q(".sd-bottom").hidden = empty || summary;
    q(".sd-summary").hidden = !summary || empty;
    q(".sd-empty").hidden = !empty;
    field("empty").textContent = snapshot.loading ? snapshot.labels.loading : snapshot.emptyMessage;
    q(".sd-empty .sd-spinner").hidden = !snapshot.loading;
    q(".sd-empty [data-action=retry]").hidden = !snapshot.canRetry || snapshot.loading;
    field("message").textContent = snapshot.loading ? snapshot.labels.loading : snapshot.message || "";
    q(".sd-status").hidden = !snapshot.loading && !snapshot.message;
    q(".sd-status [data-action=retry]").hidden = !snapshot.message || !snapshot.canRetry || snapshot.loading;
    root.querySelectorAll("button[data-action]").forEach(button => {
      button.disabled = Boolean(busy() && button.dataset.action !== "close");
      if (button.dataset.action === "nextBatch") {
        button.hidden = !snapshot.canChangeBatch;
      } else if (button.dataset.action === "revealAll") {
        button.hidden = empty || summary || snapshot.items.every(candidate => candidate.revealed);
      }
    });
    const toggle = q("input[data-action=autoShow]");
    toggle.checked = snapshot.showsOnLaunch;
    toggle.disabled = !snapshot.canSetAutoShow || Boolean(busy());
    q(".sd-preferences").hidden = !snapshot.canSetAutoShow && !snapshot.canChangeBatch;
    if (empty) { renderCover(null); return; }
    if (summary) {
      q(".sd-summary-list").replaceChildren(...snapshot.items.map(candidate => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.select = candidate.id;
        button.textContent = candidate.fullName;
        button.disabled = Boolean(busy());
        return button;
      }));
      return;
    }
    const display = identity(item);
    field("owner").textContent = display.owner;
    field("owner-path").textContent = `${display.owner} / `;
    field("repo").textContent = display.repo;
    renderCover(item);
    field("description").textContent = item.description || snapshot.labels.noDescription;
    field("language").textContent = item.language || "";
    q(".sd-language").hidden = !item.language;
    q(".sd-language").title = item.language || "";
    field("stars").textContent = compactNumber.format(item.stars);
    field("forks").textContent = compactNumber.format(item.forks);
    field("stars").setAttribute("aria-label", `${plainNumber.format(item.stars)} Stars`);
    field("forks").setAttribute("aria-label", `${plainNumber.format(item.forks)} Forks`);
    // Render the explanation once; the subtitle already covers the unspecified fallback.
    q(".sd-recommend").classList.toggle("sd-general", item.compactReason);
    q(".sd-recommend").hidden = item.compactReason && item.reasonDetail === snapshot.labels.subtitle;
    q("#reason-title").textContent = item.compactReason ? snapshot.labels.reasonTitle : item.reason;
    q("[data-retry-explanation]").hidden = !item.canRetryExplanation;
    field("reason").textContent = item.reasonDetail;
    const position = `${String(index() + 1).padStart(2, "0")} / ${String(snapshot.items.length).padStart(2, "0")}`;
    field("progress").textContent = position;
    q(".sd-progress-track").setAttribute("aria-label", snapshot.labels.title);
    q(".sd-progress-track").replaceChildren(...snapshot.items.map(candidate => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.select = candidate.id;
      button.setAttribute("aria-label", candidate.fullName);
      const line = document.createElement("span");
      line.className = "sd-progress-line";
      line.setAttribute("aria-hidden", "true");
      button.append(line);
      if (candidate.revealed) button.classList.add("sd-viewed");
      if (candidate.id === item.id) {
        button.classList.add("sd-current");
        button.setAttribute("aria-current", "true");
      }
      button.disabled = Boolean(busy());
      return button;
    }));
    root.querySelectorAll('[data-action="previous"]').forEach(button => {
      button.disabled = Boolean(busy()) || index() === 0;
    });
    q(".sd-next").textContent = index() === snapshot.items.length - 1 ? snapshot.labels.done : snapshot.labels.next;
    updatePreview("previous", -1);
    updatePreview("next", 1);
    reportPresentation();
  }

  // A failed native refresh leaves context unchanged, keeping the current card and reading position.
  function update(next) {
    if (destroyed) return;
    const old = snapshot;
    const changed = !old || old.context !== next.context;
    const itemsChanged = changed || old.items.map(item => item.id).join(",") !== next.items.map(item => item.id).join(",");
    const oldIndex = Math.max(0, index());
    if (itemsChanged || next.reduceMotion) stopMotion();
    snapshot = next;
    if (changed) {
      currentID = (next.items.find(item => !item.revealed) || next.items[0])?.id ?? null;
      summary = false;
    } else if (!next.items.some(item => item.id === currentID)) {
      currentID = next.items[Math.min(oldIndex, next.items.length - 1)]?.id ?? null;
    }
    if (itemsChanged) presented = "";
    try {
      compactNumber = new Intl.NumberFormat(next.locale, { notation: "compact", maximumFractionDigits: 1 });
      plainNumber = new Intl.NumberFormat(next.locale);
    } catch {
      compactNumber = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
      plainNumber = new Intl.NumberFormat("en");
    }
    render();
  }
  async function go(direction, targetID = null) {
    if (!snapshot || busy()) return;
    const target = targetID ? snapshot.items.find(candidate => candidate.id === targetID)
      : snapshot.items[index() + direction];
    if (!target) {
      if (direction > 0) { summary = true; render(); }
      return;
    }
    if (target.id === currentID && !summary) return;
    const revision = ++navigationRevision, context = snapshot.context;
    moving = true;
    resetTilt();
    render();
    try {
      if (canAnimate()) await main.animate([
        { opacity: 1, transform: "translateX(0) rotateY(0deg) scale(1)" },
        { opacity: 0, transform: `translateX(${-direction * 45}px) rotateY(${-direction * 8}deg) scale(.97)` }
      ], { duration: 170, easing: "ease-in", fill: "forwards" }).finished;
      if (destroyed || revision !== navigationRevision || snapshot.context !== context) return;
      currentID = target.id;
      summary = false;
      render();
      main.getAnimations?.().forEach(animation => animation.cancel());
      if (canAnimate()) await main.animate([
        { opacity: 0, transform: `translateX(${direction * 48}px) rotateY(${direction * 9}deg) scale(.97)` },
        { opacity: 1, transform: "translateX(0) rotateY(0deg) scale(1)" }
      ], { duration: 440, easing: "cubic-bezier(.22,1,.36,1)" }).finished;
    } catch {
      // Reduced motion, closing or a new native batch may cancel a decorative transition.
    } finally {
      if (revision === navigationRevision && !destroyed) {
        main.getAnimations?.().forEach(animation => animation.cancel());
        moving = false;
        render();
      }
    }
  }
  function act(type) {
    if (type === "close") { send(type); return; }
    if (!snapshot || busy()) return;
    if (type === "next" || type === "previous") { void go(type === "next" ? 1 : -1); return; }
    if (type === "star" || type === "details" || type === "dismiss") {
      if (active()) send(type, { id: active().id });
    } else if (type === "revealAll") {
      send(type);
      summary = true;
      render();
    } else if (type === "retry" || type === "nextBatch") {
      send(type);
    }
  }
  root.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button || button.disabled || !root.contains(button)) return;
    if (button.dataset.select) { void go(1, button.dataset.select); return; }
    act(button.dataset.action);
  }, { signal: listeners.signal });
  root.addEventListener("change", event => {
    if (event.target.matches('input[data-action="autoShow"]') && !event.target.disabled) {
      send("autoShow", { value: event.target.checked });
      event.target.checked = snapshot.showsOnLaunch;
    }
  }, { signal: listeners.signal });
  document.addEventListener("keydown", event => {
    if (event.repeat || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.target.closest("input, textarea, select, [contenteditable]")) return;
    const type = event.key === "ArrowRight" ? "next" : event.key === "ArrowLeft" ? "previous"
      : event.key.toLowerCase() === "s" ? "star" : event.key === "Escape" ? "close" : null;
    if (type) { event.preventDefault(); act(type); }
  }, { signal: listeners.signal });
  card.addEventListener("pointermove", event => {
    if (!snapshot || snapshot.reduceMotion || busy() || event.pointerType === "touch") return;
    const rect = card.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const x = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    const y = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
    cancelAnimationFrame(pointerFrame);
    pointerFrame = requestAnimationFrame(() => {
      tilt.style.setProperty("--sd-rx", `${(.5 - y) * 2.5}deg`);
      tilt.style.setProperty("--sd-ry", `${(x - .5) * 4}deg`);
      card.style.setProperty("--sd-mx", `${x * 100}%`);
      card.style.setProperty("--sd-my", `${y * 100}%`);
    });
  }, { signal: listeners.signal });
  card.addEventListener("pointerleave", resetTilt, { signal: listeners.signal });
  document.addEventListener("visibilitychange", reportPresentation, { signal: listeners.signal });
  window.addEventListener("error", () => send("error"), { signal: listeners.signal });
  window.starcatDiscovery = {
    update,
    destroy() {
      destroyed = true;
      stopMotion();
      cancelAnimationFrame(presentationFrame);
      listeners.abort();
    }
  };
  send("ready");
})();
</script></body></html>
