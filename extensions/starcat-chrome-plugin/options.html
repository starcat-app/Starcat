<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Starcat Companion Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <h1>Starcat Companion</h1>
          <p>Connect this extension to the Starcat local service.</p>
        </div>
      </header>

      <form id="options-form" class="panel">
        <label class="field">
          <span>Local port</span>
          <input id="port" name="port" inputmode="numeric" autocomplete="off" placeholder="5051">
        </label>

        <label class="field">
          <span>Bearer token</span>
          <input id="token" name="token" type="password" autocomplete="off" spellcheck="false">
        </label>

        <div class="actions">
          <button id="save" type="submit">Save</button>
          <button id="test" type="button">Test Connection</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
