# Starcat Xcode 工程声明文件
#
# 由 xcodegen 解析生成 Starcat.xcodeproj。
# 所有工程结构变更都改本文件 + 重新跑 `xcodegen generate`，不直接编辑 .xcodeproj。
#
# 配套阅读：docs/工程脚手架检查清单.md
name: Starcat

options:
  bundleIdPrefix: com.starcat
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

# 全局 Build Settings：
# - SWIFT_VERSION = 5.0：使用 Swift 5 语言模式，避开严格并发，渐进迁移（见开发前问题清单 5.x）
# - SWIFT_STRICT_CONCURRENCY = minimal：编译器只在 @MainActor 等显式标注处检查
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # 注意：这两个值仅作 build settings 兜底，实际产物 Info.plist 会被
    # `scripts/bump-version.sh`（postBuildScripts）覆盖：
    #   - CFBundleVersion              = git commit count + 短 hash（每次 build 自动更新）
    #   - CFBundleShortVersionString   = 最新 git tag 去掉 v 前缀（无 tag 时保留这里的兜底值）
    # 发版流程：`git tag v0.x.y && git push --tags` 后 build，关于页 / Finder 简介就会自动跟上。
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Starcat
    INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Starcat."

# SPM 依赖：与 docs/3-设计/详细设计/04-技术选型.md 保持一致
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.0.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  OpenAI:
    url: https://github.com/MacPaw/OpenAI.git
    branch: main
  ConfettiSwiftUI:
    url: https://github.com/simibac/ConfettiSwiftUI.git
    branch: master
  # 用于 RepoContextPacker（AI 摘要上下文打包）解压 GitHub source ZIP，
  # 沙箱友好 + Swift-native API + 约 200KB 体积，详见 docs/3-设计/详细设计/27-RepoContextPacker设计.md §22.2。
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.20"
  MCPSwiftSDK:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.12.1"

targets:
  Starcat:
    type: application
    platform: macOS
    sources:
      - path: Starcat
        excludes:
          - "**/.DS_Store"
    # configFiles：把 Configs/Build.xcconfig 注入到所有 build configuration（Debug + Release）。
    # Build.xcconfig 内部用 `#include? "Secrets.xcconfig"` 拉本地私密配置；缺失时静默跳过，CI 仍可编译。
    # 详见 Configs/Build.xcconfig 文件头注释。
    configFiles:
      Debug: Configs/Build.xcconfig
      Release: Configs/Build.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starcat.app
        CODE_SIGN_ENTITLEMENTS: Starcat/Starcat.entitlements
        INFOPLIST_KEY_CFBundleURLTypes: ""  # 由 entitlements + plist 增量在 info 段定义
    info:
      path: Starcat/Generated/Info.generated.plist
      properties:
        # 2026-06-29：强制单实例。Web Flow 浏览器回调 starcat://callback 时，
        # macOS 默认会启动新实例（如果 URL handler 还没准备好）+ 把 URL event
        # 派发给新 + 老两个实例。老实例 actor 状态过期 + code 已被新实例消耗，
        # 第二次 callback 会"Cannot decode token response"。
        # 设 LSMultipleInstancesProhibited=true 让 macOS 只激活已存在实例不开新。
        LSMultipleInstancesProhibited: true
        # 2026-06-29：GitHub OAuth App Client Secret（Web Flow token 交换必需）。
        # OAuth App 的 /login/oauth/access_token 要求同时带 client_secret + code_verifier
        # （PKCE 保护 code 安全但不替代 client authentication）。本字段通过 xcconfig 注入，
        # 不提交到 git。缺失时 Web Flow 退化为不可用提示。
        STARCAT_OAUTH_CLIENT_SECRET: $(STARCAT_OAUTH_CLIENT_SECRET)
        CFBundleURLTypes:
          - CFBundleURLName: com.starcat.app
            CFBundleURLSchemes:
              - starcat
        # R-01 v1.2 私密配置注入：每个自建后端独立 production API Key（xcconfig → Info.plist）。
        # 缺失时被替换为空字符串，该服务表现为 BYOK-only。
        # 读取入口：`StarcatAPIKeyDefaults.productionKeyOrNil(for:)`。
        STARCAT_PRODUCTION_API_KEY_TRENDING: $(STARCAT_PRODUCTION_API_KEY_TRENDING)
        STARCAT_PRODUCTION_API_KEY_WEEKLY: $(STARCAT_PRODUCTION_API_KEY_WEEKLY)
        STARCAT_PRODUCTION_API_KEY_SHARING: $(STARCAT_PRODUCTION_API_KEY_SHARING)
        STARCAT_PRODUCTION_API_KEY_WIKI: $(STARCAT_PRODUCTION_API_KEY_WIKI)
        STARCAT_PRODUCTION_API_KEY_RECOMMEND: $(STARCAT_PRODUCTION_API_KEY_RECOMMEND)
    dependencies:
      - package: GRDB
      - package: KeychainAccess
      - package: Kingfisher
      - package: MarkdownUI
      - package: OpenAI
      - package: ConfettiSwiftUI
      - package: ZIPFoundation
      - package: MCPSwiftSDK
        product: MCP
    # 在所有 build phase 跑完之后、codesign 之前执行：
    # 用 git 元数据改写产物 Info.plist 的 CFBundleVersion / CFBundleShortVersionString。
    # 详见 scripts/bump-version.sh 文件头注释。
    postBuildScripts:
      - name: "Auto Bump Version (from git)"
        script: '"${SRCROOT}/scripts/bump-version.sh"'
        # 不声明 inputFiles / outputFiles：希望每次 build 都跑（hash 可能变），
        # 脚本本身极快（~50ms），不写依赖避免 Xcode incremental cache 跳过执行。
        runOnlyWhenInstalling: false
        showEnvVarsInLog: false
        basedOnDependencyAnalysis: false

  StarcatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StarcatTests
    dependencies:
      - target: Starcat
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Starcat.app/Contents/MacOS/Starcat

schemes:
  Starcat:
    build:
      targets:
        Starcat: all
        StarcatTests: [test]
    run:
      config: Debug
      # 注：2026-06-08 删除了 STARCAT_*_API_URL 系列 env vars。
      # 后端 API 端点改为在「设置 → 服务」Tab 里直接配置（用户可见、运行时热生效），
      # 不再需要 Xcode scheme 勾选切换。详见 docs/功能实现总览.md D-19。
    test:
      config: Debug
      targets:
        - StarcatTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
