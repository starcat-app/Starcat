# Starcat Xcode 工程声明文件
#
# 由 xcodegen 解析生成 Starcat.xcodeproj。
# 所有工程结构变更都改本文件 + 重新跑 `xcodegen generate`，不直接编辑 .xcodeproj。
#
# 配套阅读：docs/工程脚手架检查清单.md
name: Starcat

options:
  bundleIdPrefix: com.starcat
  # Xcode scheme 里的 StoreKit 配置路径由 XcodeGen 用这个前缀拼接。
  # Xcode 26 实测会在 Run Options 中保存为 "../../Starcat/Resources/Products.storekit"；
  # 这里保持该生成结果，避免重新生成工程后丢失本地 StoreKit Testing 商品配置。
  schemePathPrefix: "../"
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  xcodeVersion: "26.5"
  createIntermediateGroups: true
  groupSortPosition: top
  # XcodeGen 2.45.4 不能可靠生成嵌套的 SystemCapabilities 字典；
  # App Store 版的 In-App Purchase、双渠道 Associated Domains capability
  # 由后处理脚本写入生成后的 .xcodeproj。
  postGenCommand: python3 scripts/postprocess-xcodeproj.py

# 全局 Build Settings：
# - SWIFT_VERSION = 6.0：使用 Swift 6 语言模式，让数据竞争检查成为编译期约束。
# - SWIFT_STRICT_CONCURRENCY = complete：保持最严格并发检查，避免新代码绕过 Swift 6 迁移目标。
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # 菜单与无障碍文字查询可能反复读取字符串表；二进制产物避免每次解析整张 XML。
    # 只改变 App / Widget 内的资源编码，源 String Catalog 仍保留 Xcode 可编辑格式。
    STRINGS_FILE_OUTPUT_ENCODING: binary
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # 注意：这两个值仅作 build settings 兜底，实际产物 Info.plist 会被
    # `scripts/bump-version.sh`（postBuildScripts）覆盖：
    #   - CFBundleVersion              = git commit count + 短 hash（每次 build 自动更新）
    #   - CFBundleShortVersionString   = 最新 git tag 去掉 v 前缀（无 tag 时保留这里的兜底值）
    # 发版流程：`git tag v0.x.y && git push --tags` 后 build，关于页 / Finder 简介就会自动跟上。
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Starcat
    INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Starcat."

# SPM 依赖：与 docs/3-设计/详细设计/04-技术选型.md 保持一致
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: "4.2.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.0.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: "0.8.0"
  OpenAI:
    url: https://github.com/MacPaw/OpenAI.git
    branch: main
  ConfettiSwiftUI:
    url: https://github.com/simibac/ConfettiSwiftUI.git
    branch: master
  # 用于 RepoContextPacker（AI 摘要上下文打包）解压 GitHub source ZIP，
  # 沙箱友好 + Swift-native API + 约 200KB 体积，详见 docs/3-设计/详细设计/27-RepoContextPacker设计.md §22.2。
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.20"
  MCPSwiftSDK:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.12.1"
  Aptabase:
    url: https://github.com/aptabase/aptabase-swift
    from: "0.3.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
  # BorderBeamKit：上游 SPM 尚未在仓库根发布 Package.swift，本地 Vendor 验证
  # line 搜索条效果。来源见 ThirdParty/BorderBeamKit/VENDOR.md。
  BorderBeamKit:
    path: ThirdParty/BorderBeamKit

targets:
  Starcat:
    type: application
    platform: macOS
    sources:
      - path: Starcat
        excludes:
          - "**/.DS_Store"
    # configFiles：把 Configs/Build.xcconfig 注入到所有 build configuration（Debug + Release）。
    # Build.xcconfig 内部用 `#include? "Secrets.xcconfig"` 拉本地私密配置；缺失时静默跳过，CI 仍可编译。
    # 详见 Configs/Build.xcconfig 文件头注释。
    configFiles:
      Debug: Configs/Build.xcconfig
      Release: Configs/Build.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starcat.app.store
        CODE_SIGN_ENTITLEMENTS: Starcat/Starcat.entitlements
        # macOS 的 group.* App Group 需要 Xcode 自动注册并维护对应签名资源。
        # 固化在 target 上，保证 Xcode Run 与命令行构建行为一致。
        REGISTER_APP_GROUPS: YES
        INFOPLIST_KEY_CFBundleURLTypes: ""  # 由 entitlements + plist 增量在 info 段定义
      configs:
        Debug:
          # macOS 可同时登记多个同 Bundle ID 的 .app；WidgetKit 按宿主标识解析
          # AppIntent 元数据时可能误命中已安装的 App Store 版本或旧 DerivedData。
          # Debug 使用独立标识，Release 继续继承 base 中的正式标识。
          PRODUCT_BUNDLE_IDENTIFIER: com.starcat.app.store.debug
          # Debug/test 必须允许多实例：xcodebuild test 会另外启动一个 test host，
          # 如果本机已有 Starcat 正在运行，固定单实例会被 LaunchServices 拒绝。
          INFOPLIST_KEY_LSMultipleInstancesProhibited: NO
        Release:
          # Release 保留单实例：Web Flow 浏览器回调 starcat://callback 时只激活现有实例。
          INFOPLIST_KEY_LSMultipleInstancesProhibited: YES
    info:
      path: Starcat/Generated/Info.generated.plist
      properties:
        # 2026-06-29：GitHub OAuth App Client Secret（Web Flow token 交换必需）。
        # OAuth App 的 /login/oauth/access_token 要求同时带 client_secret + code_verifier
        # （PKCE 保护 code 安全但不替代 client authentication）。本字段通过 xcconfig 注入，
        # 不提交到 git。缺失时 Web Flow 退化为不可用提示。
        STARCAT_OAUTH_CLIENT_SECRET: $(STARCAT_OAUTH_CLIENT_SECRET)
        # “我的项目”GitHub App Web Flow 配置。Client Secret 会随原生应用分发，
        # 只用于 user access token 的 code 交换与刷新；private key 仍严禁进入客户端。
        STARCAT_GITHUB_APP_CLIENT_ID: $(STARCAT_GITHUB_APP_CLIENT_ID)
        STARCAT_GITHUB_APP_CLIENT_SECRET: $(STARCAT_GITHUB_APP_CLIENT_SECRET)
        # GitHub App 页面 URL 中的公开 slug，用于构造安装入口。
        # Client ID 与 slug 缺一时均保持 OAuth public fallback。
        STARCAT_GITHUB_APP_SLUG: $(STARCAT_GITHUB_APP_SLUG)
        CFBundleURLTypes:
          - CFBundleURLName: com.starcat.app.store
            CFBundleURLSchemes:
              - starcat
        # R-01 v1.2 私密配置注入：每个自建后端独立 production API Key（xcconfig → Info.plist）。
        # 缺失时被替换为空字符串，该服务表现为 BYOK-only。
        # 读取入口：`StarcatAPIKeyDefaults.productionKeyOrNil(for:)`。
        STARCAT_PRODUCTION_API_KEY_TRENDING: $(STARCAT_PRODUCTION_API_KEY_TRENDING)
        STARCAT_PRODUCTION_API_KEY_WEEKLY: $(STARCAT_PRODUCTION_API_KEY_WEEKLY)
        STARCAT_PRODUCTION_API_KEY_SHARING: $(STARCAT_PRODUCTION_API_KEY_SHARING)
        STARCAT_PRODUCTION_API_KEY_WIKI: $(STARCAT_PRODUCTION_API_KEY_WIKI)
        STARCAT_PRODUCTION_API_KEY_RECOMMEND: $(STARCAT_PRODUCTION_API_KEY_RECOMMEND)
        STARCAT_PRODUCTION_API_KEY_DISCOVERY: $(STARCAT_PRODUCTION_API_KEY_DISCOVERY)
        STARCAT_PRODUCTION_API_KEY_HISTORY: $(STARCAT_PRODUCTION_API_KEY_HISTORY)
        STARCAT_COLLECTION_API_KEY: $(STARCAT_COLLECTION_API_KEY)
        STARCAT_COLLECTION_API_BASE_URL: $(STARCAT_COLLECTION_API_BASE_URL)
        # 匿名产品事件后端。留空时遥测保持 no-op；用户开关关闭时也不会发送。
        STARCAT_APTABASE_APP_KEY: $(STARCAT_APTABASE_APP_KEY)
        # 显式构建渠道。App Store build 默认 appstore；Direct build 后续覆盖为 direct。
        STARCAT_DISTRIBUTION: $(STARCAT_DISTRIBUTION)
        # Widget Extension 与 Store Host 必须读取同一 App Group；通过 Info.plist
        # 注入，避免运行时根据 bundle id 猜测并误连 Direct 渠道容器。
        STARCAT_WIDGET_APP_GROUP: group.com.starcat.app.store.widgets
        LSApplicationCategoryType: public.app-category.developer-tools
        # Starcat 只使用系统 TLS/Keychain/StoreKit 等标准加密能力，不包含非豁免加密。
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: GRDB
      - package: KeychainAccess
      - package: Kingfisher
      - package: MarkdownUI
      - package: SwiftMarkdown
        product: Markdown
      - package: OpenAI
      - package: ConfettiSwiftUI
      - package: ZIPFoundation
      - package: MCPSwiftSDK
        product: MCP
      - package: Aptabase
      - package: BorderBeamKit
      - target: StarcatWidgets
    # 在所有 build phase 跑完之后、codesign 之前执行：
    # 用 git 元数据改写产物 Info.plist 的 CFBundleVersion / CFBundleShortVersionString。
    # 详见 scripts/bump-version.sh 文件头注释。
    postBuildScripts:
      - name: "Copy Changelog Resource"
        script: |
          set -euo pipefail

          # App 内 Release Notes 根据用户首选语言读取 bundle 里的更新日志。
          # App Store 包只打包主仓库内的审核安全更新日志，避免混入 Direct-only 分发说明。
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/CHANGELOG.md" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/CHANGELOG.md"
          cp "${SRCROOT}/CHANGELOG-ZH.md" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/CHANGELOG-ZH.md"
        runOnlyWhenInstalling: false
        showEnvVarsInLog: false
        basedOnDependencyAnalysis: false
      - name: "Auto Bump Version (from git)"
        script: '"${SRCROOT}/scripts/bump-version.sh"'
        # 不声明 inputFiles / outputFiles：希望每次 build 都跑（hash 可能变），
        # 脚本本身极快（~50ms），不写依赖避免 Xcode incremental cache 跳过执行。
        runOnlyWhenInstalling: false
        showEnvVarsInLog: false
        basedOnDependencyAnalysis: false

  StarcatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StarcatTests
    dependencies:
      - target: Starcat
    configFiles:
      Debug: Configs/Build.xcconfig
      Release: Configs/Build.xcconfig
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Starcat.app/Contents/MacOS/Starcat

  StarcatDirect:
    type: application
    platform: macOS
    sources:
      - path: Starcat
        excludes:
          - "**/.DS_Store"
          - "**/Products.storekit"
          # Direct 通过用户选择或本机安装路径运行 CodebaseMemory；禁止把 258 MiB
          # 的 App Store 内置二进制复制进 Direct App。
          - "Resources/Codebase/codebase.bin"
    configFiles:
      Debug: Configs/Build.xcconfig
      Release: Configs/Build.xcconfig
    settings:
      base:
        # Direct 使用独立 bundle id，保证官网 DMG 包与 App Store 包的审核和安装边界清楚。
        PRODUCT_BUNDLE_IDENTIFIER: com.starcat.app.direct
        PRODUCT_NAME: Starcat
        CODE_SIGN_ENTITLEMENTS: Starcat/StarcatDirect.entitlements
        REGISTER_APP_GROUPS: YES
        STARCAT_DISTRIBUTION: direct
        # Direct 使用绿色 GitHub 角标图标；App Store 仍走默认 AppIcon（蓝色）。
        # 应用内 About / 启动页 / AI 气泡等均读 NSApp.applicationIconImage，会随此切换。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDirect
        INFOPLIST_KEY_CFBundleURLTypes: ""
      configs:
        Debug:
          # 与 Store 渠道保持相同隔离策略，避免 Direct 调试 Extension 解析到
          # 已安装正式版宿主；Release 仍使用 com.starcat.app.direct。
          PRODUCT_BUNDLE_IDENTIFIER: com.starcat.app.direct.debug
          STARCAT_LICENSE_API_ENVIRONMENT: test
        Release:
          STARCAT_LICENSE_API_ENVIRONMENT: live
    info:
      path: Starcat/Generated/Info.direct.generated.plist
      properties:
        # Direct Debug 不承载 StarcatTests test host；Debug/Release 都保持单实例，
        # 避免多个进程争用同一份 AppKit window restoration 状态。
        LSMultipleInstancesProhibited: true
        STARCAT_OAUTH_CLIENT_SECRET: $(STARCAT_OAUTH_CLIENT_SECRET)
        # GitHub App 配置必须同时进入 Direct 包；仅定义 xcconfig 变量不会自动写入 Info.plist。
        STARCAT_GITHUB_APP_CLIENT_ID: $(STARCAT_GITHUB_APP_CLIENT_ID)
        STARCAT_GITHUB_APP_CLIENT_SECRET: $(STARCAT_GITHUB_APP_CLIENT_SECRET)
        STARCAT_GITHUB_APP_SLUG: $(STARCAT_GITHUB_APP_SLUG)
        CFBundleURLTypes:
          - CFBundleURLName: com.starcat.app.direct
            CFBundleURLSchemes:
              - starcat
        STARCAT_PRODUCTION_API_KEY_TRENDING: $(STARCAT_PRODUCTION_API_KEY_TRENDING)
        STARCAT_PRODUCTION_API_KEY_WEEKLY: $(STARCAT_PRODUCTION_API_KEY_WEEKLY)
        STARCAT_PRODUCTION_API_KEY_SHARING: $(STARCAT_PRODUCTION_API_KEY_SHARING)
        STARCAT_PRODUCTION_API_KEY_WIKI: $(STARCAT_PRODUCTION_API_KEY_WIKI)
        STARCAT_PRODUCTION_API_KEY_RECOMMEND: $(STARCAT_PRODUCTION_API_KEY_RECOMMEND)
        STARCAT_PRODUCTION_API_KEY_DISCOVERY: $(STARCAT_PRODUCTION_API_KEY_DISCOVERY)
        STARCAT_PRODUCTION_API_KEY_HISTORY: $(STARCAT_PRODUCTION_API_KEY_HISTORY)
        STARCAT_COLLECTION_API_KEY: $(STARCAT_COLLECTION_API_KEY)
        STARCAT_COLLECTION_API_BASE_URL: $(STARCAT_COLLECTION_API_BASE_URL)
        STARCAT_LICENSE_API_ENVIRONMENT: $(STARCAT_LICENSE_API_ENVIRONMENT)
        STARCAT_LICENSE_API_TEST_BASE_URL: $(STARCAT_LICENSE_API_TEST_BASE_URL)
        STARCAT_LICENSE_API_TEST_KEY: $(STARCAT_LICENSE_API_TEST_KEY)
        STARCAT_LICENSE_API_LIVE_BASE_URL: $(STARCAT_LICENSE_API_LIVE_BASE_URL)
        STARCAT_LICENSE_API_LIVE_KEY: $(STARCAT_LICENSE_API_LIVE_KEY)
        STARCAT_APTABASE_APP_KEY: $(STARCAT_APTABASE_APP_KEY)
        STARCAT_DISTRIBUTION: $(STARCAT_DISTRIBUTION)
        # Direct 渠道使用独立 App Group，防止两个版本同时安装时互相读取快照。
        STARCAT_WIDGET_APP_GROUP: group.com.starcat.app.direct.widgets
        LSApplicationCategoryType: public.app-category.developer-tools
        # Direct 包同样只使用系统 TLS/Keychain 等标准加密能力，保持双渠道合规声明一致。
        ITSAppUsesNonExemptEncryption: false
        SUFeedURL: https://starcat.ink/appcast.xml
        SUPublicEDKey: $(STARCAT_SPARKLE_PUBLIC_ED_KEY)
        SUEnableInstallerLauncherService: YES
        SUVerifyUpdateBeforeExtraction: YES
    dependencies:
      - package: GRDB
      - package: KeychainAccess
      - package: Kingfisher
      - package: MarkdownUI
      - package: SwiftMarkdown
        product: Markdown
      - package: OpenAI
      - package: ConfettiSwiftUI
      - package: ZIPFoundation
      - package: MCPSwiftSDK
        product: MCP
      - package: Aptabase
      - package: Sparkle
      - package: BorderBeamKit
      - target: StarcatDirectWidgets
    postBuildScripts:
      - name: "Copy Changelog Resource"
        script: |
          set -euo pipefail

          # Direct 包继续使用公开 starcat-pro 更新日志，保留 Direct-only 分发与更新说明。
          CHANGELOG_SOURCE_ROOT="${SRCROOT}/supports/starcat-pro"
          if [[ ! -f "${CHANGELOG_SOURCE_ROOT}/CHANGELOG.md" || ! -f "${CHANGELOG_SOURCE_ROOT}/CHANGELOG-ZH.md" ]]; then
            # `supports/starcat-pro` 是独立仓库，不会随主仓库 worktree 自动出现。Debug 构建
            # 只验证代码与资源链路，可回退主仓库日志；Release 必须继续阻断，避免发布错误内容。
            if [[ "${CONFIGURATION}" == "Debug" ]]; then
              echo "warning: supports/starcat-pro is unavailable; using root changelog for Debug build"
              CHANGELOG_SOURCE_ROOT="${SRCROOT}"
            else
              echo "error: Direct Release requires supports/starcat-pro/CHANGELOG.md and CHANGELOG-ZH.md" >&2
              exit 1
            fi
          fi
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${CHANGELOG_SOURCE_ROOT}/CHANGELOG.md" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/CHANGELOG.md"
          cp "${CHANGELOG_SOURCE_ROOT}/CHANGELOG-ZH.md" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/CHANGELOG-ZH.md"
        runOnlyWhenInstalling: false
        showEnvVarsInLog: false
        basedOnDependencyAnalysis: false
      - name: "Auto Bump Version (from git)"
        script: '"${SRCROOT}/scripts/bump-version.sh"'
        runOnlyWhenInstalling: false
        showEnvVarsInLog: false
        basedOnDependencyAnalysis: false

  # App Store 与 Direct 使用两个独立 Extension target，但复用同一份 Swift 源码。
  # 独立 bundle id / App Group 是两个渠道同时安装时不串宿主、不串数据的签名边界。
  StarcatWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: StarcatWidgets
      # 仅复用纯 Foundation 快照契约；Extension 不编译 GRDB、网络或业务层。
      - path: Starcat/Core/Widget/Shared
      - path: Starcat/Resources/Localizable.xcstrings
        buildPhase: resources
    # Extension 必须复用宿主的本地签名 Team；否则宿主可以签名而 Widget
    # 会在 Xcode Run 阶段因缺少 development certificate 单独失败。
    configFiles:
      Debug: Configs/Build.xcconfig
      Release: Configs/Build.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starcat.app.store.widgets
        CODE_SIGN_ENTITLEMENTS: Starcat/Resources/Widget/StarcatWidgets.entitlements
        REGISTER_APP_GROUPS: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Starcat Widgets
      configs:
        Debug:
          # 必须以 Debug 宿主标识为前缀，确保 WidgetKit 将 Extension 绑定到唯一宿主。
          PRODUCT_BUNDLE_IDENTIFIER: com.starcat.app.store.debug.widgets
    info:
      path: Starcat/Generated/WidgetInfo.generated.plist
      properties:
        STARCAT_WIDGET_APP_GROUP: group.com.starcat.app.store.widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # App Store 要求 Extension 与宿主的 CFBundleVersion 一致。复用同一脚本，
    # 让两者都从当前 git commit count 生成版本，避免只更新宿主造成上传失败。
    postBuildScripts:
      - name: "Auto Bump Version (from git)"
        script: '"${SRCROOT}/scripts/bump-version.sh"'
        runOnlyWhenInstalling: false
        showEnvVarsInLog: false
        basedOnDependencyAnalysis: false

  StarcatDirectWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: StarcatWidgets
      - path: Starcat/Core/Widget/Shared
      - path: Starcat/Resources/Localizable.xcstrings
        buildPhase: resources
    configFiles:
      Debug: Configs/Build.xcconfig
      Release: Configs/Build.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starcat.app.direct.widgets
        CODE_SIGN_ENTITLEMENTS: Starcat/Resources/Widget/StarcatDirectWidgets.entitlements
        REGISTER_APP_GROUPS: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Starcat Widgets
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.starcat.app.direct.debug.widgets
    info:
      path: Starcat/Generated/WidgetInfo.direct.generated.plist
      properties:
        STARCAT_WIDGET_APP_GROUP: group.com.starcat.app.direct.widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    postBuildScripts:
      - name: "Auto Bump Version (from git)"
        script: '"${SRCROOT}/scripts/bump-version.sh"'
        runOnlyWhenInstalling: false
        showEnvVarsInLog: false
        basedOnDependencyAnalysis: false

schemes:
  Starcat:
    build:
      targets:
        Starcat: all
        StarcatTests: [test]
    run:
      config: Debug
      # App Store 本地订阅调试必须显式绑定 StoreKit 配置文件。
      # 否则 XcodeGen 重新生成工程后，Xcode Run 可能不会加载本地商品，
      # `Product.products(for:)` 会返回空数组，设置页就会显示“订阅商品暂不可用”。
      storeKitConfiguration: Starcat/Resources/Products.storekit
      # 注：2026-06-08 删除了 STARCAT_*_API_URL 系列 env vars。
      # 后端 API 端点改为在「设置 → 服务」Tab 里直接配置（用户可见、运行时热生效），
      # 不再需要 Xcode scheme 勾选切换。详见 docs/功能实现总览.md D-19。
    test:
      config: Debug
      targets:
        - StarcatTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  StarcatDirect:
    build:
      targets:
        StarcatDirect: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # WidgetBundle 同时声明 4 个 Widget 时，WidgetKit Simulator 必须通过
  # `_XCWidgetKind` 明确选择调试对象。四个共享 Scheme 让开发者无需每次手改
  # Xcode Arguments，即可逐个验证 Timeline / Medium 布局。
  StarcatWidget-Focus:
    build:
      targets:
        StarcatWidgets: all
    run:
      config: Debug
      executable: StarcatWidgets
      macroExpansion: StarcatWidgets
      launchAutomaticallySubstyle: "2"
      environmentVariables:
        _XCWidgetKind: com.starcat.widget.focus
        _XCWidgetFamily: medium
        _XCWidgetDefaultView: timeline

  StarcatWidget-Rediscovery:
    build:
      targets:
        StarcatWidgets: all
    run:
      config: Debug
      executable: StarcatWidgets
      macroExpansion: StarcatWidgets
      launchAutomaticallySubstyle: "2"
      environmentVariables:
        _XCWidgetKind: com.starcat.widget.rediscovery
        _XCWidgetFamily: medium
        _XCWidgetDefaultView: timeline

  StarcatWidget-ReleaseWatch:
    build:
      targets:
        StarcatWidgets: all
    run:
      config: Debug
      executable: StarcatWidgets
      macroExpansion: StarcatWidgets
      launchAutomaticallySubstyle: "2"
      environmentVariables:
        _XCWidgetKind: com.starcat.widget.release-watch
        _XCWidgetFamily: medium
        _XCWidgetDefaultView: timeline

  StarcatWidget-CollectionTrend:
    build:
      targets:
        StarcatWidgets: all
    run:
      config: Debug
      executable: StarcatWidgets
      macroExpansion: StarcatWidgets
      launchAutomaticallySubstyle: "2"
      environmentVariables:
        _XCWidgetKind: com.starcat.widget.collection-trend
        _XCWidgetFamily: medium
        _XCWidgetDefaultView: timeline
