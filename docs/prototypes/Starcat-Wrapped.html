r infinite}@keyframes spin{to{transform:rotate(360deg)}}.hero>*:not(svg){position:relative}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:25px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:23px}.num{font-size:clamp(32px,5vw,58px);font-weight:750;letter-spacing:-3px;color:var(--mint);display:block}.small{font-size:12px;color:var(--muted)}.tag{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:5px 10px;font-size:12px;color:var(--accent)}.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(53,minmax(5px,1fr));gap:3px;margin:20px 0}.cell{aspect-ratio:1;padding:0;border:0;border-radius:3px;background:var(--line);min-width:0}.cell[data-level="1"]{background:#245c53}.cell[data-level="2"]{background:#318d72}.cell[data-level="3"]{background:#49bb91}.cell[data-level="4"]{background:#79e5c2}.cell.unknown{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line) 3px 5px);border:1px solid var(--line)}.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin:9px 0 22px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8c6af0,#79e5c2);border-radius:8px}.topic{width:100%;text-align:left;margin:6px 0}.timeline{border-left:2px solid var(--accent);margin:25px 12px;padding-left:25px}.timeline article{position:relative;margin:24px 0}.timeline article:before{content:'';position:absolute;left:-32px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent)}footer{position:fixed;bottom:0;right:0;left:190px;background:var(--bg);border-top:1px solid var(--line);padding:12px 5vw;display:flex;align-items:center;justify-content:space-between;z-index:4}.primary{background:var(--accent);color:var(--bg);font-weight:700}.progress{height:3px;background:var(--line);position:fixed;top:0;left:0;right:0;z-index:9}.progress i{display:block;height:100%;background:var(--mint); </style><body><div class="progress"><i id="progress"></i></div><header><strong>✦ STARCAT / WRAPPED</strong><select id="dataset" aria-label="数据样例"><option value="demo">视觉演示 · 2025</option><option value="fixture">年度验收 · 2025</option></select><select id="zone" aria-label="时区"><option>Asia/Shanghai</option><option>UTC</option></select><button id="theme">◐ 明暗</button><button id="motion" aria-pressed="false">减少动效</button><button id="privacy">个人完整版</button></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div><footer><button id="prev">← 上一章</button><span id="page" class="small"></span><button class="primary" id="next">下一章 →</button></footer><dialog id="detail"><button id="close" style="float:right">关闭 ×</button><h3 id="detailTitle"></h3><div id="detailBody"></div></dialog><script>
'use strict';const $=id=>document.getElementById(id);const names=['序章','开发足迹','技术兴趣','收藏到行动','知识沉淀','年度解读','分享封面'];let step=0,publicMode=false,ai=false;const fixture={repos:[{id:'A',name:'A（验收仓库）',topics:['swift'],private:false},{id:'B',name:'B（私有验收仓库）',topics:['swift'],private:true}],events:[['2025-01-01','A','star'],['2025-03-01','A','unstar'],['2025-07-01','A','star'],['2025-08-01','B','star'],['2025-08-02','A','startedUsing'],['2025-08-02','A','enteredLibrary'],['2025-08-03','A','wroteNote']]}; // 月内具体日仅用于原型排版，非验收文档精确日期

function facts(){let f=$('dataset').value==='fixture',utc=$('zone').value==='UTC';let repos=f?fixture.repos:demoRepos,events=f?fixture.events.filter((e,i)=>!utc||i!==0):demoEvents;let stars=events.filter(e=>e[2]==='star'),ids=a=>[...new Set(events.filter(e=>a.includes(e[2])).map(e=>e[1]))];return {f,repos,events,stars,starIds:ids(['star']),writing:ids(['wroteNote','editedNote']),using:ids(['startedUsing']),library:ids(['enteredLibrary']),starCoverage:'partial',localCoverage:'partial'}}
function share(d){return {starActions:d.stars.length,distinctStarredRepos:d.starIds.length,reposWithWriting:d.writing.length,starCoverage:d.starCoverage,localCoverage:d.localCoverage}}
function metric(n,label,kind='记录到'){return `<div class="card"><span class="small">${kind}</span><span class="num">${n}</span>${label}</div>`}function chapter(i,title,sub,body){return `<section class="${step===i?'active':''}"><div class="eyebrow">CHAPTER 0${i+1} / 2025</div><h2>${title}</h2><p>${sub}</p>${body}</section>`}function evidence(title,ids){let d=facts();$('detailTitle').textContent=title;$('detailBody').replaceChildren();let p=document.createElement('p');p.textContent=`${ids.length} 个去重仓库 · 仅个人报告可见`; $('detailBody').append(p);ids.forEach(id=>{let r=d.repos.find(x=>x.id===id),el=document.createElement('p');el.textContent=r.name+(r.private?' · 私有':'');$('detailBody').append(el)});$('detail').showModal()}
function render(){let d=facts(),s=share(d),topics={};d.repos.filter(r=>d.starIds.includes(r.id)).forEach(r=>[...new Set(r.topics)].forEach(t=>(topics[t]??=[]).push(r.id)));let list=Object.entries(topics).sort((a,b)=>b[1].length-a[1].length);$('nav').innerHTML=names.map((n,i)=>`<button data-step="${i}" class="${step===i?'active':''}">0${i+1} &nbsp; ${n}</button>`).join('');let orbit=`<svg class="orbit" viewBox="0 0 300 300"><g fill="none" stroke="#b8a6ff"><circle cx="150" cy="150" r="115"/><ellipse cx="150" cy="150" rx="140" ry="55" transform="rotate(35 150 150)"/><ellipse cx="150" cy="150" rx="140" ry="55" transform="rotate(-35 150 150)"/></g><g fill="#79e5c2"><circle cx="45" cy="103" r="6"/><circle cx="250" cy="201" r="8"/><circle cx="150" cy="35" r="4"/></g><text x="150" y="177" text-anchor="middle" fill="#b8a6ff" font-size="85">✦</text></svg>`;let cover=`<div class="cover" id="cover"><div><div class="eyebrow" style="color:#d6c5ff">STARCAT × GITHUB</div><h2>2025<br>探索不止<span style="color:#9df2d7">.</span></h2><p>${d.f?'年度验收样例':'视觉演示数据'} · 非真实个人报告</p></div><div><span class="num">${s.starActions}</span>记录到的收藏次数<div style="display:flex;gap:35px;margin-top:22px"><div><strong style="font-size:30px">${s.distinctStarredRepos}</strong><br>不同仓库</div><div><strong style="font-size:30px">${s.reposWithWriting}</strong><br>写作仓库</div></div></div><p>收藏历史与本机整理均为部分覆盖<br>YOUR YEAR IN OPEN SOURCE ✦</p></div>`;
$('main').innerHTML=publicMode?chapter(step,'公开分享预览','仅展示白名单聚合字段；不包含仓库、标签、事件、笔记或 AI 正文。',cover+'<button id="export">导出公开 JSON</button> <button id="png">导出封面 PNG</button>'): `<section class="${step===0?'active':''}"><div class="hero">${orbit}<div class="eyebrow">GITHUB × STARCAT / YEAR IN REVIEW</div><h1>2025<br>探索不止<span style="color:var(--mint)">.</span></h1><p>每一次收藏，都是对未知世界的一次好奇。</p><span class="tag">${d.f?'年度验收样例':'视觉演示数据'} · 非真实账户</span><div class="grid">${metric(s.starActions,'Star 动作')}${metric(s.distinctStarredRepos,'不同收藏仓库')}${metric(s.reposWithWriting,'正文写入仓库')}</div><button class="primary" data-step="1">开启年度旅程 →</button></div><p>自然年 2025 · ${$('zone').value} · 截止 2026-01-01 00:00 UTC · 统计口径 v1<br>收藏与本机整理：部分覆盖。分类按生成时刻冻结，而非历史标签。</p></section>`+chapter(1,'每一天，都是足迹。','GitHub 贡献与 Starcat 收藏分开统计。'+(d.f?' 验收样例未提供 GitHub 贡献，不能视作零。':' 以下贡献日历为合成演示。'),`<div class="card"><div class="eyebrow">CONTRIBUTION CALENDAR</div><h3>${d.f?'— 贡献历史未知':'365 天的开发节奏'}</h3><div style="display:flex;justify-content:space-between" class="small">${['Jan','Mar','May','Jul','Sep','Dec'].map(m=>`<span>${m}</span>`).join('')}</div><div class="heat" id="heat"></div><p id="dayInfo">点击日期查看贡献详情</p><span class="small">斜纹：未知　灰色：零贡献　绿色：有贡献（深浅表示次数）</span></div>`)+chapter(2,'好奇心，有迹可循。','按期间收藏过的不同仓库统计主题；同仓同主题去重，跨主题可重复。',`<div class="card"><div class="eyebrow">TOPIC CONSTELLATION</div>${list.map(([t,ids],i)=>`<button class="topic" data-topic="${i}">${t} <strong style="float:right">${ids.length} 个仓库 ↗</strong></button><div class="bar"><i style="width:${ids.length/d.starIds.length*100}%"></i></div>`).join('')}<p>按生成时分类 · 点击主题查看仓库证据</p></div>`)+chapter(3,'从喜欢，到真正行动。','各指标独立计数，并非转化漏斗；只按同仓库及时间证据串联。',`<div class="grid">${metric(s.distinctStarredRepos,'收藏仓库')}${metric(d.library.length,'进入知识库仓库')}${metric(d.using.length,'标记在用仓库')}${metric(d.writing.length,'写作仓库')}</div><div class="card"><span class="tag">同仓证据 · ${d.f?'A':'示例项目 01'}</span><div class="timeline">${(d.f?[['1 月','首次收藏'],['3 月','同步发现取消收藏'],['7 月','再次收藏'],['8 月','标记在用 / 自动入库'],['8 月','写入人工笔记']]:[['1 月','收藏发现'],['10 月','进入知识库'],['10 月','标记在用'],['11 月','写入笔记']]).filter((x,i)=>!d.f||$('zone').value!=='UTC'||i!==0).map(x=>`<article><span class="small">${x[0]}</span><h3>${x[1]}</h3></article>`).join('')}</div><p>不据此推断掌握程度；未匹配 GitHub 贡献。</p></div>`)+chapter(4,'把发现，变成知识。','仅正文新增或有效修改计为写作；状态变化和空白笔记不计。',`<div class="grid">${metric(d.writing.length,'正文写入仓库')}${metric(d.library.length,'入库涉及仓库')}</div><div class="card"><h3>写作历史覆盖</h3><div class="grid">${metric('—','4 月 · 历史未知','采集前')}${metric(0,'9 月 · 零写作','完整本机覆盖')}</div><p>本机采集自 7 月 1 日开始；年度为部分覆盖，不代表跨设备完整历史。</p><button id="writing">查看写作仓库 ↗</button></div>`)+chapter(5,'读懂这一年的你。','事实不依赖 AI。解读由用户主动触发；此离线原型仅使用确定性模板。',`<div class="card"><div class="eyebrow">INSIGHT / ${ai?'OFFLINE TEMPLATE':'READY'}</div><h3>${ai?'从探索走向整理':'让数字成为故事'}</h3><p>${ai?`记录中有 ${s.starActions} 次收藏，涉及 ${s.distinctStarredRepos} 个仓库；${s.reposWithWriting} 个仓库发生正文写入。这说明样例中存在探索与整理行为，但不足以判断全年成长或技能掌握。`:'尚未生成解读。不会自动发送任何个人数据。'}</p><button class="primary" id="ai">${ai?'重新生成模板':'生成年度解读'}</button><p class="small">非模型生成 · 无网络请求 · 依据本页冻结样例</p></div>`)+chapter(6,'这一年，值得收藏。','分享前预览公开内容。默认只导出五个验收白名单字段。',cover+'<button id="export">导出公开 JSON</button> <button id="png">导出封面 PNG</button> <button id="preview">进入公开预览</button>');
$('progress').style.width=(step+1)/7*100+'%';$('page').textContent=publicMode?'公开预览':`${step+1} / 7 · ${names[step]}`;$('prev').disabled=publicMode||step===0;$('next').disabled=publicMode;$('next').textContent=step===6?'返回封面 ↺':'下一章 →';$('nav').style.visibility=publicMode?'hidden':'visible';$('privacy').textContent=publicMode?'公开分享预览':'个人完整版';
let heat=$('heat');if(heat){for(let i=0;i<365;i++){let date=new Date(Date.UTC(2025,0,i+1)).toISOString().slice(0,10),n=d.f?null:(i%11<3?0:(i*17+i%9)%13),b=document.createElement('button');b.className='cell'+(n===null?' unknown':'');b.dataset.level=n===null?0:Math.min(4,Math.ceil(n/3));b.title=date+' · '+(n===null?'未知':n+' 次贡献');b.setAttribute('aria-label',b.title);b.onclick=()=>{$('dayInfo').textContent=b.title};heat.append(b)}}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>evidence(list[+b.dataset.topic][0],list[+b.dataset.topic][1]));if($('writing'))$('writing').onclick=()=>evidence('正文写入仓库',d.writing);if($('ai'))$('ai').onclick=()=>{ai=true;render()};if($('preview'))$('preview').onclick=togglePublic;if($('export'))$('export').onclick=()=>download(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),'starcat-public.json');if($('png'))$('png').onclick=()=>png(s,d.f);}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function png(s,f){let c=document.createElement('canvas');c.width=1080;c.height=1350;let x=c.getContext('2d'),g=x.createLinearGradient(0,1350,1080,0);g.addColorStop(0,'#171a31');g.addColorStop(1,'#7051b5');x.fillStyle=g;x.fillRect(0,0,1080,1350);x.fillStyle='#fff';x.font='bold 32px sans-serif';x.fillText('STARCAT × GITHUB',90,110);x.font='bold 150px sans-serif';x.fillText('2025',90,330);x.font='bold 95px sans-serif';x.fillText('探索不止',90,470);x.fillStyle='#9df2d7';x.font='bold 180px sans-serif';x.fillText(String(s.starActions),90,730);x.fillStyle='#fff';x.font='42px sans-serif';x.fillText('记录到的收藏次数',90,800);x.fillText(`${s.distinctStarredRepos} 个不同仓库`,90,950);x.fillText(`${s.reposWithWriting} 个写作仓库`,90,1020);x.font='30px sans-serif';x.fillText('收藏与本机整理均为部分覆盖',90,1180);x.fillText((f?'年度验收样例':'视觉演示数据')+' · 非真实账户',90,1240);c.toBlob(b=>{if(b)download(b,'starcat-cover.png')})}function go(i){step=i;render();window.scrollTo(0,0)}function togglePublic(){publicMode=!publicMode;$('detail').close();render()}$('privacy').onclick=togglePublic;$('prev').onclick=()=>go(Math.max(0,step-1));$('next').onclick=()=>go((step+1)%7);$('theme').onclick=()=>document.documentElement.classList.toggle('light');if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.classList.add('light');$('motion').onclick=()=>{let b=document.documentElement.classList.toggle('reduce');$('motion').setAttribute('aria-pressed',String(b));$('motion').textContent=b?'动效已减少':'减少动效'};$('dataset').onchange=$('zone').onchange=()=>{ai=false;render()};$('close').onclick=()=>$('detail').close();document.addEventListener('keydown',e=>{if(publicMode||$('detail').open||['BUTTON','SELECT','INPUT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(Math.min(6,step+1));if(e.key==='ArrowLeft')go(Math.max(0,step-1))});render();
